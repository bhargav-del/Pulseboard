name: Build and publish Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop build dependencies
        run: npm install --no-audit --no-fund

      - name: Build self-contained Windows apps
        run: npm run dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: ${{ env.APP_NAME }} v1.0.5
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: release/*.exe
        env:
          APP_NAME: Pulseboard
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
